controllers:
  main:
    containers:
      main:
        image:
          repository: glanceapp/glance
          tag: v0.8.6

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: glance.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    type: configMap
    name: glance-config
    advancedMounts:
      main:
        main:
          - path: /app/config
