replicaCount: 1
image:
  registry: ghcr.io
  repository: dani-garcia/vaultwarden
  tag: 1.37.4-alpine
service:
  type: ClusterIP
  port: 80
resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi
storage:
  data:
    name: "vaultwarden-data"
    size: "2Gi"
    class: "longhorn"
    path: "/data"
    keepPvc: true
    accessMode: "ReadWriteOnce"
domain: https://bitwarden.vincentdeborger.be
ingress:
  enabled: true
  class: bunkerweb
  # Chart defaults add nginx-only redirect annotations; not wanted here.
  nginxIngressAnnotations: false
  additionalAnnotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    acme.cert-manager.io/http01-edit-in-place: "true"
  tls: true
  tlsSecret: "bitwarden-vincentdeborger-be-tls"
  hostname: "bitwarden.vincentdeborger.be"
