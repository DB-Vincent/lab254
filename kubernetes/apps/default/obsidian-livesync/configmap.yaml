---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-livesync-init
  labels:
    app: obsidian-livesync
data:
  init.sh: |
    #!/bin/bash
    set -e

    COUCHDB_USER=$(cat /secret/username)
    COUCHDB_PASS=$(cat /secret/password)

    /docker-entrypoint.sh /opt/couchdb/bin/couchdb &
    COUCHDB_PID=$!

    until curl -s -u "$COUCHDB_USER:$COUCHDB_PASS" http://localhost:5984/_session -o /dev/null 2>/dev/null; do
      sleep 2
    done

    curl -s -X PUT http://localhost:5984/_users --user "$COUCHDB_USER:$COUCHDB_PASS" -o /dev/null
    curl -s -X PUT http://localhost:5984/_replicator --user "$COUCHDB_USER:$COUCHDB_PASS" -o /dev/null
    curl -s -X PUT http://localhost:5984/_global_changes --user "$COUCHDB_USER:$COUCHDB_PASS" -o /dev/null
    echo "System databases created."

    wait $COUCHDB_PID
