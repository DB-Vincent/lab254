---
apiVersion: v1
kind: ConfigMap
metadata:
  name: obsidian-livesync-init
  labels:
    app: obsidian-livesync
data:
  init.sh: |
    #!/bin/bash
    set -e

    COUCHDB_USER=$(cat /secret/username)
    COUCHDB_PASS=$(cat /secret/password)

    echo "Writing admin credentials to local.d/docker.ini..."
    printf "\n[admins]\n%s = %s\n" "$COUCHDB_USER" "$COUCHDB_PASS" > /opt/couchdb/etc/local.d/docker.ini

    echo "Starting CouchDB in background..."
    /opt/couchdb/bin/couchdb &
    COUCHDB_PID=$!

    echo "Waiting for CouchDB to be ready..."
    until curl -s http://localhost:5984/ -o /dev/null 2>/dev/null; do
      sleep 2
    done

    echo "Creating system databases..."
    curl -s -X PUT http://localhost:5984/_users --user "$COUCHDB_USER:$COUCHDB_PASS" -o /dev/null
    curl -s -X PUT http://localhost:5984/_replicator --user "$COUCHDB_USER:$COUCHDB_PASS" -o /dev/null
    curl -s -X PUT http://localhost:5984/_global_changes --user "$COUCHDB_USER:$COUCHDB_PASS" -o /dev/null
    echo "System databases created."

    wait $COUCHDB_PID
