---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-livesync
  labels:
    app: obsidian-livesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-livesync
  template:
    metadata:
      labels:
        app: obsidian-livesync
    spec:
      containers:
        - name: couchdb
          image: docker.io/oleduc/docker-obsidian-livesync-couchdb:1.0.3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5984
              protocol: TCP
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    echo "Waiting for CouchDB to be ready..."
                    until curl -sf http://localhost:5984/_up; do
                      sleep 2
                    done
                    echo "Creating system databases..."
                    curl -sf -X PUT http://$(cat /secret/username):$(cat /secret/password)@localhost:5984/_users
                    curl -sf -X PUT http://$(cat /secret/username):$(cat /secret/password)@localhost:5984/_replicator
                    curl -sf -X PUT http://$(cat /secret/username):$(cat /secret/password)@localhost:5984/_global_changes
                    echo "System databases created."
          env:
            - name: SERVER_URL
              value: "https://couchdb.vincentdeborger.be"
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: obsidian-livesync
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-livesync
                  key: password
            - name: COUCHDB_DATABASE
              value: "obsidian"
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
            - name: secret
              mountPath: /secret
              readOnly: true
      volumes:
        - name: couchdb-data
          persistentVolumeClaim:
            claimName: obsidian-livesync-data
        - name: secret
          secret:
            secretName: obsidian-livesync
