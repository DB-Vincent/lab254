---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-livesync
  labels:
    app: obsidian-livesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-livesync
  template:
    metadata:
      labels:
        app: obsidian-livesync
    spec:
      containers:
        - name: couchdb
          image: docker.io/couchdb:3.5.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - /scripts/init.sh
          ports:
            - name: http
              containerPort: 5984
              protocol: TCP
          env:
            - name: SERVER_URL
              value: "https://couchdb.vincentdeborger.be"
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: obsidian-livesync
                  key: username
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obsidian-livesync
                  key: password
            - name: COUCHDB_DATABASE
              value: "obsidian"
          readinessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_up
              port: http
            initialDelaySeconds: 30
            periodSeconds: 60
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
            - name: init-script
              mountPath: /scripts
            - name: secret
              mountPath: /secret
              readOnly: true
      volumes:
        - name: couchdb-data
          persistentVolumeClaim:
            claimName: obsidian-livesync-data
        - name: init-script
          configMap:
            name: obsidian-livesync-init
            defaultMode: 0755
        - name: secret
          secret:
            secretName: obsidian-livesync
