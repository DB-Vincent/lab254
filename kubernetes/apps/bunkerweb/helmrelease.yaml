apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bunkerweb
  namespace: bunkerweb
spec:
  interval: 30m
  chart:
    spec:
      chart: bunkerweb
      version: 1.1.0
      sourceRef:
        kind: HelmRepository
        name: bunkerweb
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: bunkerweb-helm-values
      valuesKey: values.yaml
