controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: thewicklowwolf/lidify
          tag: 0.2.11
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Brussels
          PUID: 1000
          PGID: 100
          # Last.fm is the only discovery source since the Spotify API was locked down
          # (TheWicklowWolf/Lidify#24). The API key/secret come from lidify-credentials.
          mode: LastFM
          # Lidarr lives in the same namespace; Lidify talks to its API directly.
          lidarr_address: http://lidarr:8686
          # Must match the Lidarr root folder (id 1, /data/Music in the cluster).
          root_folder_path: /data/Music
          # Matches the root folder defaults in Lidarr: quality 2 = Lossless, metadata 1 = Standard.
          quality_profile_id: 2
          metadata_profile_id: 1
          # Fall back to the top Last.fm result when there is no confident match.
          fallback_to_top_result: "true"
        envFrom:
          - secretRef:
              name: lidify-credentials

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 5000

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: lidify.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        main:
          - path: /lidify/config