controllers:
  main:
    replicas: 1
    pod:
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
    containers:
      main:
        image:
          repository: ghcr.io/mrusse/soularr
          tag: 1.2.2
          pullPolicy: IfNotPresent
        env:
          TZ: Europe/Brussels
          SCRIPT_INTERVAL: "300"
          WEBUI_ENABLED: "true"
          WEBUI_PORT: "8265"
        envFrom:
          - secretRef:
              name: soularr-credentials

configMaps:
  soularr-config:
    enabled: true
    data:
      # The doubled dollar signs are not a typo. Flux's kustomize-controller runs
      # envsubst in strict mode over generated ConfigMaps, so a bare dollar-brace
      # placeholder fails the build with "variable not set". The doubled dollar
      # escapes to a literal dollar, and soularr expands the placeholder from its
      # own environment at startup.
      config.ini: |-
        [Lidarr]
        api_key = $${LIDARR_API_KEY}
        host_url = http://lidarr.media.svc.cluster.local:8686
        download_dir = /data/downloads/soularr
        disable_sync = False

        [Slskd]
        api_key = $${SLSKD_API_KEY}
        host_url = http://slskd.media.svc.cluster.local:5030
        url_base = /
        download_dir = /downloads/soularr
        delete_searches = True
        stalled_timeout = 3600
        remote_queue_timeout = 300

        [Release Settings]
        use_selected_lidarr_release = False
        use_most_common_tracknum = True
        allow_multi_disc = True
        accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
        skip_region_check = False
        accepted_formats = CD,Digital Media,Vinyl

        [Search Settings]
        search_type = incrementing_page
        number_of_albums_to_grab = 10
        minimum_filename_match_ratio = 0.8
        minimum_search_interval = 5
        allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
        search_source = missing
        failed_import_denylist = True

        [Download Settings]
        download_filtering = True
        use_extension_whitelist = True
        extensions_whitelist = txt,nfo,jpg,lrc,log,cue,m3u
        rename_download_folders = True

        [Logging]
        level = INFO
        format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
        datefmt = %Y-%m-%dT%H:%M:%S%z
        log_to_file = True
        log_file = soularr.log
        max_bytes = 1048576
        backup_count = 3

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 8265

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: soularr.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        main:
          - path: /data
  soularr-config:
    enabled: true
    type: configMap
    identifier: soularr-config
    advancedMounts:
      main:
        main:
          - path: /data/config.ini
            subPath: config.ini
  downloads:
    enabled: true
    type: nfs
    server: 172.16.2.23
    path: /Plex
    advancedMounts:
      main:
        main:
          - path: /downloads
            subPath: downloads
