controllers:
  main:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 100
    initContainers:
      prepare-downloads:
        image:
          repository: busybox
          tag: 1.38.0
          pullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 100
        command:
          - /bin/sh
          - -ec
          - |
            mkdir -p /downloads/slskd/.incomplete
            chmod 2775 /downloads/slskd /downloads/slskd/.incomplete
    containers:
      main:
        image:
          repository: slskd/slskd
          tag: 0.26.2
          pullPolicy: IfNotPresent
        securityContext:
          # The slskd entrypoint runs groupmod/usermod to apply PUID/PGID, which
          # requires a writable /etc.
          readOnlyRootFilesystem: false
        env:
          PUID: 1000
          PGID: 100
          TZ: Europe/Brussels
          # Required so the Soulseek network credentials can be entered from the web UI.
          SLSKD_REMOTE_CONFIGURATION: "true"
          # Required by Lidarr.Plugin.Slskd: with this off, imports still succeed but
          # completed downloads are never deleted and the folder fills up.
          SLSKD_REMOTE_FILE_MANAGEMENT: "true"
          # Consumed by the Lidarr plugin, not by soularr (removed).
          SLSKD_DOWNLOADS_DIR: /downloads/slskd
          SLSKD_INCOMPLETE_DIR: /downloads/slskd/.incomplete
        envFrom:
          - secretRef:
              name: slskd-credentials
      gluetun:
        image:
          repository: qmcgaw/gluetun
          tag: v3.41.3
        metadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
        env:
          vpn_service_provider: private internet access
          vpn_type: openvpn
          server_regions: netherlands
          firewall_input_ports: "9091"          # ports your service/ingress hits
          firewall_outbound_subnets: "10.244.0.0/16,10.96.0.0/12,192.168.1.0/24"  # pod, service, lan
          dns_keep_nameserver: "on"             # keep cluster dns working
          dot: "off"
        envfrom:
          - secretref:
              name: pia-credentials
        securitycontext:
          capabilities:
            add: ["net_admin"]

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 5030

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: slskd.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 2Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        main:
          - path: /app
  downloads:
    enabled: true
    type: nfs
    server: 172.16.2.23
    path: /Plex
    advancedMounts:
      main:
        main:
          - path: /downloads
            subPath: downloads
        prepare-downloads:
          - path: /downloads
            subPath: downloads
  tun:
    type: hostPath
    hostPath: /dev/net/tun
    hostPathType: CharDevice
    advancedMounts:
      transmission:
        gluetun:
          - path: /dev/net/tun
