apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiomuse
  namespace: media
spec:
  interval: 30m
  chart:
    spec:
      chart: audiomuse-ai
      version: 1.1.6
      sourceRef:
        kind: HelmRepository
        name: audiomuse
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: audiomuse-helm-values
      valuesKey: values.yaml
