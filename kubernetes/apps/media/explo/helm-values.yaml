controllers:
  main:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 100
    initContainers:
      prepare-dirs:
        image:
          repository: busybox
          tag: 1.38.0
          pullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 100
        command:
          - /bin/sh
          - -ec
          - |
            mkdir -p /data /slskd
            chmod 2775 /data /slskd
    containers:
      main:
        image:
          repository: ghcr.io/lumepart/explo
          tag: v1.2.0
          pullPolicy: IfNotPresent
        securityContext:
          # The entrypoint applies PUID/PGID and writes its cron jobs, so it must
          # start as root and drop privileges (same pattern as slskd).
          readOnlyRootFilesystem: false
        env:
          TZ: Europe/Brussels
          PUID: 1000
          PGID: 100
          # Web UI.
          WEB_UI: "true"
          WEB_ADDR: ":7288"
          WEB_DATA_PATH: /opt/explo/config/
          WEB_ENV_PATH: /opt/explo/config/.env
          # Config is supplied by env/secret (GitOps), so skip the interactive wizard.
          WIZARD_COMPLETE: "true"
          # Music system: Navidrome over the Subsonic API.
          EXPLO_SYSTEM: subsonic
          SYSTEM_URL: http://navidrome:4533
          # Download priority: Lidarr (album requests) -> slskd (Soulseek) -> YouTube.
          DOWNLOAD_SERVICES: lidarr,slskd,youtube
          LIDARR_URL: http://lidarr:8686
          LIDARR_ROOT_FOLDER: Music
          # Lidarr imports into the shared library itself, so Explo must not move files.
          LIDARR_MIGRATE_DOWNLOADS: "false"
          SLSKD_URL: http://slskd:5030
          # slskd writes into the shared /slskd mount; Explo moves finished tracks into /data.
          SLSKD_MIGRATE_DOWNLOADS: "true"
        envFrom:
          - secretRef:
              name: explo-credentials

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 7288

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: explo.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 2Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        main:
          - path: /opt/explo/config
  media:
    enabled: true
    type: nfs
    server: 172.16.2.23
    path: /Plex
    advancedMounts:
      main:
        main:
          - path: /data
            subPath: Music/explo
        prepare-dirs:
          - path: /data
            subPath: Music/explo
  slskd:
    enabled: true
    type: nfs
    server: 172.16.2.23
    path: /Plex
    advancedMounts:
      main:
        main:
          - path: /slskd
            subPath: downloads/slskd
        prepare-dirs:
          - path: /slskd
            subPath: downloads/slskd