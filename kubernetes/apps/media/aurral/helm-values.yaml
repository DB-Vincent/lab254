controllers:
  main:
    replicas: 1
    pod:
      securityContext:
        fsGroup: 100
    initContainers:
      prepare-dirs:
        image:
          repository: busybox
          tag: 1.38.0
          pullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
          runAsGroup: 100
        command:
          - /bin/sh
          - -ec
          - |
            mkdir -p /music/playlists/aurral
            chmod 2775 /music/playlists/aurral
    containers:
      main:
        image:
          repository: ghcr.io/lklynet/aurral
          tag: "2.11.0"
          pullPolicy: IfNotPresent
        securityContext:
          # The entrypoint applies PUID/PGID (groupadd/useradd + setpriv) and
          # chowns /config, so it must start as root and drop privileges
          # (same pattern as slskd and explo).
          readOnlyRootFilesystem: false
        env:
          TZ: Europe/Brussels
          PUID: 1000
          PGID: 100
          AURRAL_DATA_DIR: /config
          # Downloads Folder: playlist songs, flow media and playlist artwork.
          # Deliberately outside /music/downloads, so nothing Aurral owns lands
          # in slskd's raw download tree. Lives under the /music mount Navidrome
          # uses, so the paths Aurral reports to Navidrome's /api/library
          # resolve correctly (/music/playlists/aurral in both containers).
          DOWNLOAD_FOLDER: /music/playlists/aurral
          FILE_BROWSE_ROOTS: /music
          # slskd only mounts /Plex/downloads, which it sees as /downloads;
          # translate the paths it reports to the /music paths Aurral sees.
          PATH_MAPPINGS: "slskd|/downloads|/music/downloads"

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 3001

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: aurral.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        main:
          - path: /config
  media:
    enabled: true
    type: nfs
    server: 172.16.2.23
    path: /Plex
    advancedMounts:
      main:
        main:
          - path: /music
        prepare-dirs:
          - path: /music
