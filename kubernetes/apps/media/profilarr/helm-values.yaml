controllers:
  main:
    replicas: 1
    containers:
      main:
        image:
          repository: ghcr.io/dictionarry-hub/profilarr
          tag: "2.2.0"
          pullPolicy: IfNotPresent
        env:
          PUID: 1000
          PGID: 1000
          UMASK: "022"
          TZ: Europe/Brussels
          ORIGIN: http://profilarr.lab254.lab.lan
          AUTH: "on"

service:
  main:
    controller: main
    type: ClusterIP
    ports:
      http:
        port: 6868

ingress:
  main:
    className: cilium
    annotations:
      ingress.cilium.io/loadbalancer-mode: shared
    hosts:
      - host: profilarr.lab254.lab.lan
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: http

persistence:
  config:
    enabled: true
    storageClass: longhorn
    size: 1Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        main:
          - path: /config
